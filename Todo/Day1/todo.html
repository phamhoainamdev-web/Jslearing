<!DOCTYPE html>
 <html>
    <head>
        <input id="todoinput" placeholder = "Nhập việc cần làm" />
        <button onclick="hiendanhsach()">thêm</button>
    </head>
    <body>
        <p>Danh sách:</p>
        <p id ="thongbao"></p>
        <ul id="danhsachtodo"></ul>
    </body>
    <script>
        let danhsachtodo = []
        function hiendanhsach() {
            let todo = document.getElementById("todoinput").value
            if (todo === "") {
                document.getElementById("thongbao").textContent = "Bạn chưa nhập todo!"}
            else {
                danhsachtodo.push(todo)
                let ul=document.getElementById("danhsachtodo")
                ul.innerHTML =""
                for (let i = 0; i < danhsachtodo.length; i++){
                    ul.innerHTML += `<li>${danhsachtodo[i]}</li>`
                }
            }
        }
    </script>

</html>
