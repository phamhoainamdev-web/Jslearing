<!DOCTYPE html>
 <html>
    <head>
        <style>
            body {background-color: lightblue;}
            input {font-size: 20px;}
            button {font-size: 20px;}
            #danhsachtodo {font-size: 20px;}
            li {margin-bottom: 20px;
                font-size: 20px;
            }
        </style>
    </head>

    <body>
        <input id="todoinput" placeholder = "Nhập việc cần làm" />
        <button onclick="themtodo()">Thêm</button>
        <button onclick="filter ='all'; taodanhsach()">All</button>
        <button onclick="filter ='complete'; taodanhsach()">Hoàn Thành</button>
        <button onclick="filter ='uncomplete'; taodanhsach()">Chưa Hoàn Thành</button>
        <button onclick="xoadanhsachdahoanthanh()">Xóa việc đã hoàn thành</button>
        <p style="font-size: 20px;">Danh sách:</p>
        <p id ="thongbao"></p>
        <ol id = "danhsachtodo"></ol>
        <p id = "soviecconlai"></p>
        <p id ="suadanhsach"></p>
    </body>

    <script>
        let danhsachtodo = localStorage.getItem("todolocal")
        let filter = "all"
        if (danhsachtodo === null) {
            danhsachtodo = []
        }
        else {
            danhsachtodo = JSON.parse(danhsachtodo)
        } 
        function taodanhsach() {
            let ol=document.getElementById("danhsachtodo")
                ol.innerHTML =""
                for (let i = 0; i < danhsachtodo.length; i++){
                    let hienthi = filter ==="all" || (filter === "complete" && danhsachtodo[i].completed) || (filter =="uncomplete" && !danhsachtodo[i].completed)

                    if (hienthi) {
                        let style = ""
                        if (danhsachtodo[i].completed) {
                            style = "text-decoration: line-through;"
                        }
                        ol.innerHTML += `<li><span style="${style}">${danhsachtodo[i].todo}</span> 
                            <button onclick="xoadanhsach(${i})">Xóa</button> 
                            <button onclick="hoanthanh(${i})">Hoàn thành</button> 
                            <button onclick="suadanhsach(${i})">Sửa</button></li>`}
                        }
                    }

        function themtodo() {
            let todo = document.getElementById("todoinput").value
            
            if (todo === "") {
                document.getElementById("thongbao").textContent = "Bạn chưa nhập todo!"}
            else {
                danhsachtodo.push({todo:todo, completed: false})  
                document.getElementById("todoinput").value = ""
                render()
            }
        }
        function xoadanhsach(i) {
            danhsachtodo.splice(i, 1)
            render()
        }
        function hoanthanh(i) {
            danhsachtodo[i].completed = !danhsachtodo[i].completed
            render()
        }
        function suadanhsach(i) {
            let viecmoi = prompt("Nhập nội dung mới")
            if (!viecmoi) {viecmoi = danhsachtodo[i].todo}
            danhsachtodo[i].todo = viecmoi
            render()
        }
        
        function demsoviecdahoanthanh() {
            let countcomplete = 0
            for (let i = 0; i < danhsachtodo.length; i++) {
                if (danhsachtodo[i].completed === true) {
                    countcomplete+=1
                }}
            document.getElementById("soviecconlai").textContent = `Bạn đã làm được:${countcomplete} việc`
        }   
    
    function luutodolocal() {
            let todolocal = JSON.stringify(danhsachtodo)
            localStorage.setItem("todolocal", todolocal)
        }
    
    function xoadanhsachdahoanthanh() {
        for (let i = danhsachtodo.length - 1;i >= 0; i--){
            if (danhsachtodo[i].completed) {
                danhsachtodo.splice(i,1)
            }
        }
        render()
    }
        taodanhsach()
        demsoviecdahoanthanh()
        let input = document.getElementById("todoinput")
        input.addEventListener("keydown", function(event){
        if (event.key === "Enter") {
        themtodo()}
    })
    function render() {
        taodanhsach()
        demsoviecdahoanthanh()
        luutodolocal()
    }
    </script>

</html>
